name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build + Developer-ID sign, but skip notarize/publish'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The same gate ci.yml runs, not a copy of it. A tag can point at any commit --
  # the stale local v0.1.0-beta was proof (#49) -- so without this the release
  # path could publish a tree nothing had ever validated. It runs on Linux, off
  # the release Mac, so a ~35 minute gate does not eat the build job's budget.
  verify:
    if: github.repository == 'johnnylibretexts/libretexts-reader'
    uses: ./.github/workflows/verify.yml

  release:
    needs: verify
    if: github.repository == 'johnnylibretexts/libretexts-reader'
    runs-on: [self-hosted, macos, release]
    # 60 was too tight for what this job does: a cold `cargo build --release`
    # including ort's ~73MB ONNX Runtime fetch, then a second full Tauri build,
    # then `notarytool submit --wait`, which Apple answers anywhere between 5 and
    # 40 minutes. Hitting the timeout burns the tag and forces a delete-and-
    # re-push, so the headroom is worth more than an early cancel: a genuinely
    # hung job is still bounded, just not tightly.
    timeout-minutes: 120
    env:
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version, tag, and mode
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            DRY_RUN="false"
          else
            VERSION="$(node -e "process.stdout.write(String(require('./src-tauri/tauri.conf.json').version))")"
            TAG="v${VERSION}"
            DRY_RUN="${{ github.event.inputs.dry_run }}"
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "dry_run=$DRY_RUN"
            # semver pre-release (a hyphen after the version core) -> mark prerelease
            if [[ "$VERSION" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Verify tag matches configured version
        if: github.event_name == 'push'
        run: scripts/ci/check-version.sh "${{ steps.meta.outputs.version }}"

      - name: Install npm dependencies (Node 22.20.0)
        run: |
          set -euo pipefail
          source "$HOME/.nvm/nvm.sh"
          nvm use 22.20.0
          npm ci

      - name: Materialize native libs via build.rs
        # Load-bearing: this build triggers build.rs to download pdfium so the
        # next step can Developer-ID re-sign them BEFORE tauri:build bundles them. Do
        # not remove or fold into the build step — the re-sign must happen in between.
        run: |
          set -euo pipefail
          source "$HOME/.cargo/env"
          cargo build --release -p libretexts-reader

      - name: Developer-ID re-sign native libs
        run: |
          set -euo pipefail
          ID="$APPLE_SIGNING_IDENTITY"
          if [ -z "$ID" ]; then echo "APPLE_SIGNING_IDENTITY variable is not set" >&2; exit 1; fi
          # pdfium dylib(s). Tauri signs what it builds; a bundled native it
          # merely copies stays ad-hoc signed, and notarization rejects that.
          for lib in src-tauri/resources/pdfium/*/libpdfium.dylib; do
            codesign --force --options runtime --timestamp --sign "$ID" "$lib"
          done

      - name: Build signed bundle
        run: |
          set -euo pipefail
          source "$HOME/.nvm/nvm.sh"; nvm use 22.20.0
          source "$HOME/.cargo/env"
          export APPLE_SIGNING_IDENTITY
          # Fails the build if plugins.updater exists with a missing or placeholder
          # pubkey. It cannot catch the plugin being added with no config block
          # at all -- build.rs returns early there -- which is what
          # scripts/ci/check-updater-key.sh covers, in the gate above.
          export LIBRETEXTS_READER_REQUIRE_UPDATER_KEY=1
          npm run tauri:build

      # Reads the built .app, not build.rs. The notices were written to a path
      # the bundler could not see for the whole life of the project, and no
      # amount of reading the build script revealed it -- only opening the
      # bundle did. Placed here, before anything is published.
      - name: Licence notices are in the bundle
        run: scripts/ci/check-licenses-bundled.sh

      - name: Locate DMG
        id: dmg
        run: |
          set -euo pipefail
          DMG="target/release/bundle/dmg/LibreTexts Reader_${{ steps.meta.outputs.version }}_aarch64.dmg"
          test -f "$DMG"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"

      # Pass 1 of 2. Notarizing the DMG also notarizes the .app inside it, and
      # that is what makes a ticket available to staple onto the .app below.
      # Nothing needs signing here -- `npm run tauri:build` already codesigned
      # both the .app and this DMG.
      - name: Notarize, and staple the .app (pass 1)
        if: steps.meta.outputs.dry_run != 'true'
        run: |
          set -euo pipefail
          xcrun notarytool submit "${{ steps.dmg.outputs.path }}" \
            --keychain-profile jr-notary --wait
          xcrun stapler staple "target/release/bundle/macos/LibreTexts Reader.app"

      # Pass 2 of 2 -- #102. Tauri bundles the DMG from the .app BEFORE anything
      # is stapled, so pass 1 on its own ships a DMG whose inner .app has no
      # ticket. That build is not broken (Gatekeeper fetches the ticket over the
      # network) but a tester whose FIRST LAUNCH IS OFFLINE sees "cannot be
      # verified". Rebuilding the image around the now-stapled .app closes it.
      #
      # Runs on dry runs too, minus the notarizing: a dry run is the rehearsal
      # this pipeline gets (#48), and rehearsing pass 1 while skipping the step
      # that rebuilds and re-signs the shipped artifact would rehearse the wrong
      # half. Nothing is published either way.
      - name: Rebuild the DMG around the stapled .app (pass 2)
        run: |
          set -euo pipefail
          ID="$APPLE_SIGNING_IDENTITY"
          if [ -z "$ID" ]; then echo "APPLE_SIGNING_IDENTITY variable is not set" >&2; exit 1; fi
          ROOT="$PWD"
          DMG="${{ steps.dmg.outputs.path }}"

          STAGE="$(mktemp -d)"
          ditto "$ROOT/target/release/bundle/macos/LibreTexts Reader.app" \
            "$STAGE/LibreTexts Reader.app"

          # Build under the CANONICAL filename: codesign derives the signature
          # Identifier from the file name, and it has to match what tauri:build
          # produced ("LibreTexts Reader_<version>_aarch64").
          BUILDDIR="$(mktemp -d)"
          NEW="$BUILDDIR/$(basename "$DMG")"
          cd "$ROOT/target/release/bundle/dmg"
          # --skip-jenkins is explicit here. CI=true only reaches this script when
          # the Tauri bundler invokes it; called directly, the flag is ours to pass,
          # and without it the run dies in Finder AppleScript on a headless runner.
          ./bundle_dmg.sh \
            --volname "LibreTexts Reader" --icon "LibreTexts Reader.app" 180 170 \
            --app-drop-link 480 170 --window-size 660 400 \
            --hide-extension "LibreTexts Reader.app" --volicon "icon.icns" \
            --skip-jenkins "$NEW" "$STAGE"
          cd "$ROOT"

          # codesign BEFORE notarizing, always. tauri:build signs the .dmg for you;
          # a DMG built by hand from bundle_dmg.sh is NOT signed, and an unsigned
          # DMG notarizes and staples perfectly happily while spctl still rejects
          # it with "no usable signature". Signing afterwards is not a fix either --
          # it rewrites the file and voids the ticket.
          codesign --force --sign "$ID" --timestamp "$NEW"
          # Cheap and local. Do it before the 5-40 minute round trip, not after.
          codesign --verify --strict "$NEW"

          if [ "${{ steps.meta.outputs.dry_run }}" != "true" ]; then
            xcrun notarytool submit "$NEW" --keychain-profile jr-notary --wait
            xcrun stapler staple "$NEW"
          fi
          mv -f "$NEW" "$DMG"

      # The check #102 exists for. spctl uses the NETWORK, so it reports
      # "accepted / Notarized Developer ID" for an unstapled app and is
      # structurally unable to catch this bug -- only `stapler validate` can.
      # That is why both run, and why the inner-app check is not optional.
      - name: Verify the shipped artifact
        run: |
          set -euo pipefail
          DMG="${{ steps.dmg.outputs.path }}"
          codesign -dvv "$DMG" 2>&1 | grep "Authority=Developer ID Application" \
            || { echo "DMG is not Developer-ID signed" >&2; exit 1; }
          codesign --verify --strict "$DMG"

          if [ "${{ steps.meta.outputs.dry_run }}" = "true" ]; then
            echo "dry run: signature verified, skipping notarization checks"
            exit 0
          fi

          xcrun stapler validate "$DMG"
          spctl -a -t open --context context:primary-signature -vvv "$DMG"

          MNT="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT" >/dev/null
          trap 'hdiutil detach "$MNT" >/dev/null 2>&1 || true' EXIT
          # Fails loudly with "does not have a ticket stapled to it" if pass 2
          # ever regresses.
          xcrun stapler validate "$MNT/LibreTexts Reader.app"
          codesign --verify --deep --strict "$MNT/LibreTexts Reader.app"
          spctl -a -t exec -vvv "$MNT/LibreTexts Reader.app"

      - name: Publish GitHub Release
        if: steps.meta.outputs.dry_run != 'true' && github.event_name == 'push'
        run: |
          set -euo pipefail
          DMG="${{ steps.dmg.outputs.path }}"
          BASENAME="$(basename "$DMG")"
          SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          # Commit-based notes via the API, then append the checksum.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${{ steps.meta.outputs.tag }}" --jq '.body' > notes.md \
            || echo "Release ${{ steps.meta.outputs.tag }}" > notes.md
          # shellcheck disable=SC2016 # single-quoted intentionally: backticks are literal markdown, not command substitution
          printf '\n\n---\nSHA-256 (%s):\n`%s`\n' "$BASENAME" "$SHA" >> notes.md
          PRERELEASE=""
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then PRERELEASE="--prerelease"; fi
          gh release create "${{ steps.meta.outputs.tag }}" "$DMG" \
            --title "LibreTexts Reader ${{ steps.meta.outputs.tag }}" \
            --notes-file notes.md $PRERELEASE
