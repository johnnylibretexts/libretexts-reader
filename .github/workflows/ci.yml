name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The gate itself lives in verify.yml, so release.yml runs the same one rather
  # than a copy. See that file for why it is on Linux and not macOS.
  verify:
    uses: ./.github/workflows/verify.yml
