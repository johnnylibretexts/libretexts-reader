# What `cargo about` should consider part of the shipped binary.
#
# macOS only, because that is the only platform this app bundles for -- a
# Linux-only crate in the tree contributes no code to the .app and attributing
# it would misdescribe what the reader received.
targets = ["x86_64-apple-darwin", "aarch64-apple-darwin"]

# Neither runs in the shipped binary: build dependencies produce it, dev
# dependencies test it.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Every licence in the tree must appear here. A new dependency under terms not
# on this list fails the generator rather than being attributed silently --
# which is the point, because that is the moment a human has to look.
accepted = [
    "Apache-2.0",
    # A certificate-data bundle (webpki-roots), permissive.
    "CDLA-Permissive-2.0",
    # NOT an endorsement. The `epub` crate is GPL-3.0 and is linked into a
    # binary distributed under Apache-2.0, which is a licence-compatibility
    # problem rather than an attribution one -- tracked in #107. Listed here
    # so the generated notice states the fact plainly instead of the generator
    # refusing to describe the app as it actually ships.
    "GPL-3.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
