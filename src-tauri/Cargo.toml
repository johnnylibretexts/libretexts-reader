[package]
name = "libretexts-reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Offline TTS reader for OpenStax, LibreTexts, and arbitrary text"

[lib]
name = "libretexts_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
flate2 = "1.0"
hex = "0.4"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
xz2 = "0.1"
zip = "3.0"

[dependencies]
tauri = { version = "2.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"

tokio = { version = "1.40", features = ["full"] }
futures = "0.3"

rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"

reqwest = { version = "0.12", features = ["rustls-tls", "json", "gzip", "stream"], default-features = false }

pdfium-render = { version = "0.8", features = ["sync"] }
epub = "2.1"
readability = "0.3"
scraper = "0.20"
zip = "3.0"

flate2 = "1.0"

mp3lame-encoder = "0.2"
# MIT. Writes the ID3v2 tags that carry a chapter's licence and attribution out
# with the exported MP3 -- without them an export is a derivative work with the
# credit stripped. Pure Rust, so no process spawn and no new bundled binary; its
# notice is in LICENSES/.
id3 = "1"
hound = "3.5"
ort = "2.0.0-rc.12"
ndarray = "0.17"
rand = "0.8"
rand_distr = "0.4"

uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1.20"
regex = "1.11"
unicode-segmentation = "1.12"
unicode-normalization = "0.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
async-trait = "0.1"

# Test-only. Neither crate is reachable from the built application: cargo does
# not compile dev-dependencies into the lib or bin targets, so nothing here
# ships in a bundle.
#
# `wiremock` stands in for a remote Source so the retry, backoff and cache
# behaviour every remote Import depends on can be exercised without the network.
# `tempfile` exists because the connection pool takes a file path and has no
# in-memory constructor -- and an in-memory pool is a trap, since each pooled
# connection would open its own separate database unless a shared-cache URI is
# used. A throwaway directory per test is the honest version.
[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
